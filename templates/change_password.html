{% extends "base_auth.html" %}
{% block title %}Change Password - DonorIQ{% endblock %}
{% block content %}
<div class="glass-card rounded-xl p-8 w-full relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container rounded-full blur-[60px] opacity-20 pointer-events-none"></div>

    <div class="text-center mb-stack-lg relative z-10">
        <h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Set a new password</h1>
        <p class="font-body-sm text-body-sm text-on-surface-variant">You'll use this the next time you sign in.</p>
    </div>

    <form method="POST" action="/change-password" class="space-y-stack-md relative z-10">
        {% if error %}
        <div class="rounded-lg px-4 py-3 text-body-sm font-body-sm" style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35); color: #fca5a5;">
            {{ error }}
        </div>
        {% endif %}

        <div class="input-group">
            <input class="w-full px-4 py-3 rounded-lg font-body-sm text-body-sm" id="new_password" name="new_password" placeholder=" " required minlength="8" type="password">
            <label class="font-body-sm" for="new_password">New password</label>
        </div>
        <div class="input-group">
            <input class="w-full px-4 py-3 rounded-lg font-body-sm text-body-sm" id="confirm_password" name="confirm_password" placeholder=" " required minlength="8" type="password">
            <label class="font-body-sm" for="confirm_password">Confirm password</label>
        </div>

        <button class="shimmer-btn w-full flex justify-center py-3 px-4 rounded-lg text-white font-label-md text-label-md" type="submit">
            Update password
        </button>
    </form>
</div>
{% endblock %}
